# Config with custom town data (v3.1.0)
# Usage: uv run socialsimullm run --config examples/custom_town.yaml
# Output: runs/custom_town/exp_custom_town/
#
# Uses a hand-crafted town_data.json with Chinese setting.
# This is the simplest way to define a custom world.

experiment_id: exp_custom_town
project: custom_town
model: gpt-4o-mini
simulation_steps: 72
random_seed: 42
checkpoint_interval: 10
spatial_graph_path: examples/town_data_custom.json
