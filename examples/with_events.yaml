# Config with global events injection (v3.1.0)
# Usage: uv run socialsimullm run --config examples/with_events.yaml
# Output: runs/events_demo/exp_events_demo/
#
# Demonstrates permanent legacy events and bounded timed events.

experiment_id: exp_events_demo
project: events_demo
simulation_steps: 288
random_seed: 42
checkpoint_interval: 10

events:
  # Legacy string events remain active for the full run.
  - "A mysterious merchant arrives in town, offering rare goods at the market square."
  # Timed events are active for the inclusive start/end step window.
  - id: lower-district-flood
    content: "Heavy rain causes flooding in the lower district."
    start_step: 24
    end_step: 72
    locations:
      - "Phandalin Town Square"
    importance: 8
