findings:
  - id: network-diffusion
    title: 信息沿同辈与项目网络扩散
    evidence_level: mechanism_evidence
    claim: 技术议题通过室友讨论、项目协作与研究指导进入不同角色的任务安排。
    mechanism: 关系网络提供重复接触、解释和把抽象技术连接到既有任务的机会。
    alternative_explanations: [共同地点造成同时暴露, 角色提示词预先强化了技术兴趣]
    pdf_pages: [36, 37, 41, 42]
    archive_metric_ids: [ge-ivmodel-actions]
  - id: compatibility-scenes
    title: 兼容性需要通过具体场景兑现
    evidence_level: paper_interpretation
    claim: 编程、教学机器人、生物医学和金融等角色把同一技术信息转译为不同用途。
    mechanism: 相对优势只有与角色目标、设备和场景需求匹配时才进入持续行动。
    alternative_explanations: [专业角色文本更容易生成技术词, 词项计数未衡量实际使用深度]
    pdf_pages: [38, 39, 40, 41]
    archive_metric_ids: [ge-ivmodel-actions]
  - id: policy-nonlinearity
    title: 政策响应具有非线性与信息冗余
    evidence_level: paper_interpretation
    claim: 政策信息并未均匀改变所有角色，响应集中于能连接实习、项目或公益任务的少数 Agent。
    mechanism: 已有目标和关系网络筛选政策信息；重复信息可能强化关注，也可能形成冗余。
    alternative_explanations: [单次生成波动, 不同分支历史并非完全可观测, 关键词遗漏隐含政策响应]
    pdf_pages: [37, 38, 39, 40]
    archive_metric_ids: [ge-policy-actions, na-policy-actions]
  - id: reverse-teacher-student
    title: 师生关系存在反向扩散
    evidence_level: mechanism_evidence
    claim: 学生的项目探索也可能进入教师的研究或教学议程，而非只有自上而下传播。
    mechanism: 共同项目把学生的新用法转化为教师可评估的实践证据。
    alternative_explanations: [角色设定中的共同技术兴趣, 摘要压缩放大了少量互动]
    pdf_pages: [39]
    archive_metric_ids: [ge-ivmodel-actions]
  - id: triple-coupling
    title: 社交网络、场景需求与政策响应三重耦合
    evidence_level: paper_interpretation
    claim: 扩散不是单一事件的线性结果，而是关系传播、任务适配和环境信号共同塑造的过程。
    mechanism: 网络决定信息到达，场景决定信息能否被使用，政策改变收益与风险解释。
    alternative_explanations: [模型文本惯性, 缺少组织与校外对照, 无重复实验无法分离三类机制]
    pdf_pages: [44]
    archive_metric_ids: [ge-ivmodel-actions, na-ivmodel-actions, na-policy-actions]
  - id: causal-effect-unverified
    title: 事件对采纳率的因果效应尚未识别
    evidence_level: unverified_alternative
    claim: 当前归档支持过程比较和假设生成，不支持总体因果效应或统计显著性声明。
    mechanism: 两组均为单次生成，且归档未覆盖全部五个正式分支和重复运行。
    alternative_explanations: [随机生成差异, 未归档配置差异, 编码规则敏感性]
    pdf_pages: [43]
    archive_metric_ids: []

limitations:
  - id: archived-coverage
    description: paper 分支只保留 GE、NA 两组结果，未保留五个正式分支的完整同构档案。
    consequence: 展示必须分开“正式设计”和“可审计归档”，不能填造缺失组结果。
    pdf_pages: []
  - id: no-replication
    description: 归档没有随机种子、重复实验编号或统计检验。
    consequence: 所有组间数字只能作为描述性探索，不报告 p 值、置信区间或显著差异。
    pdf_pages: []
  - id: lexical-coding
    description: IVModel 与 policy 指标来自词项规则，不能完整覆盖隐含采纳、抵制或使用深度。
    consequence: 指标必须与行动摘录和机制证据共同解释。
    pdf_pages: []
  - id: context-boundary
    description: 组织制度、安全治理与校外对照仍不充分。
    consequence: 不能直接外推到其他高校、企业或更广泛社会群体。
    pdf_pages: [43]
  - id: copied-memory
    description: 同一地点可见行动会复制到多个 Agent 的 memory 文件。
    consequence: memory 词频不能作为采纳率分母；本案例使用主行动日志的 4,200 条记录。
    pdf_pages: []
  - id: malformed-event
    description: 两组 event.json 均包含 Day 1 18:00 内容仅为“23”的异常事件。
    consequence: 该记录从研究事件和二次编码中排除，并保留为数据质量说明。
    pdf_pages: []

