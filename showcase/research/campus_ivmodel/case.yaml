schema_version: '1.0'
case_id: campus-ivmodel-diffusion
title: 大学生群体中新技术创新扩散仿真
summary: >-
  以创新扩散与 TOE 框架为理论入口，将技术特征、组织资源、关系网络和政策事件映射为
  可介入的社会仿真变量；正式设计包含五个动态分支，仓库保留 GE、NA 两组可审计运行档案。
provenance:
  paper_title: 突破互动边界：大学生群体中新技术创新扩散的大模型社会仿真研究
  paper_file: 20250618-毕业论文-突破互动边界：大学生群体中新技术创新扩散的大模型社会仿真研究.pdf
  paper_pages: [31, 32, 33, 36, 37, 38, 39, 40, 41, 42, 43, 44]
  repository_branch: paper
  repository_commit: cfedfc5689fb8cc43f9e68046f28a0469bef968f
  source_paths:
    - simulation/projects/breaking_en_ge_IVModel_Round420_Day6
    - simulation/projects/breaking_en_na_IVModel_Round420_Day6
  archive_note: >-
    论文描述五个正式分支；paper 分支仅归档 GE、NA 两组完整结果，因此档案指标不外推为五组实测结果。

research_questions:
  - id: rq-diffusion
    title: 技术如何跨越互动边界
    question: 新技术信息如何沿同辈、项目和师生关系进入异质大学生的行动议程？
    theoretical_lens: [创新扩散理论, 社会网络]
    pdf_pages: [36, 37, 41, 42]
  - id: rq-context
    title: 场景与资源如何塑造采纳
    question: 技术兼容性、使用场景和可用资源如何共同影响技术的选择性转译？
    theoretical_lens: [TOE 框架, 场景需求]
    pdf_pages: [38, 39, 40, 41]
  - id: rq-policy
    title: 政策信息如何产生非线性响应
    question: 鼓励、限制与重复信息如何改变不同角色的关注和行动路径？
    theoretical_lens: [环境维度, 信息冗余]
    pdf_pages: [37, 38, 39, 40]

scale:
  branch_count: 5
  archived_branch_count: 2
  agents_per_branch: 10
  locations: 10
  rounds_per_branch: 420
  planned_rounds: 2100
  time_step_minutes: 10
  starts_at: Day 1, 08:00
  ends_at: Day 6, 08:00
  execution_note: 2,100 是五个分支各 420 轮的设计规模求和；分支继承共享前缀，不表示 2,100 轮完全独立执行。

config:
  language: English simulation records with Chinese research reporting
  model: Doubao-1.5-pro-32k（论文报告；归档元数据未记录）
  embedding_model: BAAI/bge-m3
  memory_limit: 15
  global_time_limit: 24
  max_attempts: 2
  output_artifacts:
    - per-agent JSON memory
    - SQLite embedding index
    - simulation text log
    - staged simulation summary
    - event archive
  missing_reproducibility_fields:
    - archive-level model identifier
    - random seed
    - temperature and sampling parameters
    - repeated-run identifiers
    - model-call cost and token ledger

variables:
  - id: technology-exposure
    name: 技术信息接触
    role: independent
    theoretical_source: 创新扩散理论
    operationalization: 在指定仿真时间向部分或全部 Agent 注入 IVModel 爆火事件。
    measurement: 接触对象、接触范围与接触后的技术词行动轨迹。
    pdf_pages: [33]
  - id: policy-direction
    name: 政策方向
    role: independent
    theoretical_source: TOE 环境维度
    operationalization: Day 4 注入鼓励部署或学术限制与医疗鼓励并存的政策事件。
    measurement: 政策词主行动的阶段计数及角色分布。
    pdf_pages: [33]
  - id: compatibility
    name: 技术—任务兼容性
    role: moderator
    theoretical_source: TOE 技术维度
    operationalization: Agent 是否能将模型能力转译到编程、教学、金融、科研或公益任务。
    measurement: 行动和阶段摘要中的具体应用场景链条。
    pdf_pages: [38, 39, 40, 41]
  - id: social-network
    name: 同辈、项目与师生网络
    role: mechanism
    theoretical_source: 创新扩散理论与社会网络
    operationalization: 由角色共处、讨论与项目协作形成的信息传递路径。
    measurement: 可追溯互动片段与跨角色的议题延续。
    pdf_pages: [36, 37, 41, 42]
  - id: role-resources
    name: 角色目标与资源条件
    role: context
    theoretical_source: TOE 组织维度
    operationalization: 专业、职业目标、设备和地点资源写入 Agent 与环境描述。
    measurement: 不同角色的技术与政策行动计数差异。
    pdf_pages: [38, 39, 40]
  - id: agenda-action
    name: 技术进入行动议程
    role: dependent
    theoretical_source: 过程型创新扩散
    operationalization: 主行动文本出现 IVModel 或 policy 词项，作为描述性议题显著性指标。
    measurement: 以每组 4,200 条主行动为分母的词项编码计数。
    pdf_pages: []

branches:
  - id: branch-1
    name: 分支 1 · 自然发展
    branch_type: natural_development
    baseline: 所有 Agent 从共同的 Day 1 初始状态自然运行，不追加技术或政策事件。
    interventions: []
  - id: branch-2
    name: 分支 2 · 部分技术接触
    branch_type: partial_exposure
    parent_id: branch-1
    baseline: 继承分支 1 的共同基线。
    interventions:
      - intervention_type: technology_exposure
        global_time: Day 2, 08:00
        recipients: [Lin Lingyue, Su Nuanyang, Qin Yanqiu, Lin Xingya]
        intensity: partial
        direction: neutral
        content: IVModel 因易部署、高性能和兼容性而快速流行。
        pdf_pages: [33]
  - id: branch-3
    name: 分支 3 · 全体技术接触
    branch_type: full_exposure
    parent_id: branch-1
    baseline: 继承分支 1 的共同基线。
    interventions:
      - intervention_type: technology_exposure
        global_time: Day 2, 08:00
        recipients: [all agents]
        intensity: all
        direction: neutral
        content: IVModel 因易部署、高性能和兼容性而快速流行。
        pdf_pages: [33]
  - id: branch-4
    name: 分支 4 · 鼓励部署
    branch_type: encouragement_policy
    parent_id: branch-2
    baseline: 继承分支 2 的部分接触轨迹。
    interventions:
      - intervention_type: policy_encouragement
        global_time: Day 4, 08:00
        recipients: [all agents]
        intensity: all
        direction: encourage
        content: 鼓励学校与企业部署本地 AI，并使用工具提高效率。
        pdf_pages: [33]
  - id: branch-5
    name: 分支 5 · 分阶段混合政策
    branch_type: mixed_policy
    parent_id: branch-3
    baseline: 继承分支 3 的全体接触轨迹。
    interventions:
      - intervention_type: policy_restriction
        global_time: Day 4, 08:00
        recipients: [Lin Lingyue, Wang Mingzhe, Qin Yanqiu]
        intensity: staged
        direction: mixed
        content: 学术内容生产被要求谨慎使用 AI，同时医疗案例应用受到鼓励；首批角色接收。
        pdf_pages: [33]
      - intervention_type: policy_restriction
        global_time: Day 4, 13:00
        recipients: [Qin Yanqiu, Bai Qingyu, Wang Mingzhe]
        intensity: staged
        direction: mixed
        content: 同一混合政策进入第二批角色的信息环境。
        pdf_pages: [33]
      - intervention_type: policy_restriction
        global_time: Day 4, 19:00
        recipients: [Shen Ranxi, Bai Qingyu, Jiang Yanzhou]
        intensity: staged
        direction: mixed
        content: 同一混合政策进入第三批角色的信息环境。
        pdf_pages: [33]

